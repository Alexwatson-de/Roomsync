name: RoomSync checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:storage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
# No token, .env.local, Admin key or production test database is required.
# Deployment is intentionally separate from CI until access is configured.
